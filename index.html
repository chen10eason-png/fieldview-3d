<!doctype html><html lang="zh-Hant"><head><style>html,body{margin:0;background:#0b1419;color:#e9f5f2}</style><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><meta name="theme-color" content="#0b1419"/><meta name="description" content="台灣棒球場 3D 視野模擬。第一站：臺北大巨蛋。"/><meta name="robots" content="noindex, nofollow"/><title>FIELDVIEW 3D｜臺北大巨蛋</title></head><body><div id="app"><div style="padding:32px;max-width:700px;margin:12vh auto;font-family:system-ui,sans-serif;color:#e9f5f2"><h1>FIELDVIEW 3D</h1><p>臺北大巨蛋 · 網站載入中</p><p id="boot-status" style="opacity:.7">正在啟動 3D 球場…</p></div></div><script>window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&(!a.querySelector('.shell')||!a.querySelector('canvas'))){var x=document.getElementById('boot-status');if(x)x.textContent='初始化錯誤：'+(e.message||'資源載入失敗');else {var d=document.createElement('div');d.style.cssText='position:fixed;bottom:12px;left:12px;right:12px;z-index:99999;padding:16px;background:#432;color:white;font:14px system-ui;border-radius:10px';d.textContent='3D 啟動錯誤：'+(e.message||'資源載入失敗');document.body.appendChild(d);}}});window.addEventListener('unhandledrejection',function(e){var x=document.getElementById('boot-status');if(x)x.textContent='載入錯誤：'+String(e.reason&&e.reason.message||e.reason);});setTimeout(function(){var x=document.getElementById('boot-status');if(x)x.textContent='載入逾時：請確認 GitHub Pages 發布的是最新 dist，或檢查瀏覽器資源載入錯誤。';},12000);</script><script type="module" src="/src/main.js"></script></body></html>
